<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting for reservations, questions, and trip information.">
    <meta name="author" content="Victor Fontes">

    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

<header>

    <img src="images/logo.jpg" alt="White Water Rafting Logo">

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
    </nav>

</header>

<main>

    <h1>Contact Us</h1>

    <section class="contact-info">

        <h2>Company Information</h2>

        <p><strong>Address:</strong> 123 River Road, Jackson, Wyoming 83001</p>

        <p><strong>Phone:</strong> (307) 555-1234</p>

        <p><strong>Email:</strong> info@whitewaterrafting.com</p>

        <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d92476.07977973521!2d-110.97905730273438!3d43.58826800000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x535305d65c1b1b21%3A0xd39a80d685af2553!2sFaraway%20Jackson%20Hole!5e0!3m2!1ses-419!2sus!4v1785605352932!5m2!1ses-419!2sus"
    width="600"
    height="450"
    allowfullscreen
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin">
</iframe>

    </section>

    <section class="employees">

        <h2>Meet Our Team</h2>

        <figure>
            <img src="images/guide1.jpg" alt="Lead River Guide">
            <figcaption>John Smith — Lead River Guide</figcaption>
        </figure>

        <figure>
            <img src="images/manager.jpg" alt="Office Manager">
            <figcaption>Sarah Johnson — Office Manager</figcaption>
        </figure>

        <figure>
            <img src="images/reservation.jpg" alt="Reservation Specialist">
            <figcaption>Emily Davis — Reservation Specialist</figcaption>
        </figure>

    </section>

    <section class="contact-form">

        <h2>Send Us a Message</h2>

        <form action="#" method="post">

            <div>
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required>
            </div>

            <div>
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required>
            </div>

            <fieldset>

                <legend>Purpose of Your Message</legend>

               <label for="general">
    <input
        type="radio"
        id="general"
        name="purpose"
        value="general"
        checked>
    General Inquiry
</label>

               <label for="reservation">
    <input
        type="radio"
        id="reservation"
        name="purpose"
        value="reservation">
    Reservation Question
</label>

               <label for="website">
    <input
        type="radio"
        id="website"
        name="purpose"
        value="website">
    Website Suggestion
</label>

            </fieldset>

            <div>
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required></textarea>
            </div>

          <label for="newsletter" class="newsletter">
    <input
        type="checkbox"
        id="newsletter"
        name="newsletter">

    Please subscribe me to the monthly newsletter.
</label>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>

    <p>&copy; 2026 White Water Rafting | Victor Fontes</p>

    <nav class="socialmedia">
        <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
        <a href="#"><img src="images/instagram.jpg" alt="Instagram"></a>
        <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
    </nav>

</footer>

</body>

</html>
